name: Release Library Crates to crates.io

# Publishes the four library crates, then tags the verified commit and creates a release.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-library-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LIB_PACKAGES: >-
    gpui-luma
    gpui-luma-color
    gpui-luma-look-radix
    gpui-luma-look-shadcn

jobs:
  publish:
    name: Verify, publish, tag, and release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          for package in ${LIB_PACKAGES}; do
            package_id="$(cargo pkgid --locked --package "$package")"
            if [[ "${package_id##*@}" != "${version}" ]]; then
              echo "${package} does not match workspace version ${version}" >&2
              exit 1
            fi
          done
          tag="v${version}"
          echo "workspace_version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${version}"
          echo "Tag: ${tag}"

      - name: Reject tag if it already exists on another commit
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already points at ${existing}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy library crates
        run: |
          # shellcheck disable=SC2086
          cargo clippy --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-targets --all-features

      - name: Test library crates (including inspection, headless support, and docs)
        run: |
          cargo test --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-features
          cargo test --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --doc --all-features

      - name: Package and verify all library crates
        run: |
          set -euo pipefail
          cargo package --locked --registry crates-io \
            $(printf -- '--package %s ' ${LIB_PACKAGES})

      - name: Publish missing crates and verify contents
        env:
          VERSION: ${{ steps.meta.outputs.workspace_version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 - <<'PY'
          """Verify packaged contents before skipping or completing crates.io uploads."""

          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import time
          import urllib.error
          import urllib.request


          PACKAGES = os.environ["LIB_PACKAGES"].split()


          def download(url):
              request = urllib.request.Request(url, headers={"User-Agent": "gpui-luma-release (https://gpui-luma.dev)"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()


          def contents(data):
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                  return {member.name: archive.extractfile(member).read() for member in archive if member.isfile()}


          def local_archive(package, version):
              archive = f"{package}-{version}.crate"
              for directory in (Path("target/package"), Path("target/package/tmp-registry")):
                  path = directory / archive
                  if path.is_file():
                      return path.read_bytes()
              raise RuntimeError(f"Missing verified local archive: {archive}")


          def verify_package(package, version, attempts=1):
              expected = contents(local_archive(package, version))
              if os.environ.get("GITHUB_SHA"):
                  vcs = json.loads(expected[f"{package}-{version}/.cargo_vcs_info.json"])["git"]
                  if vcs["sha1"] != os.environ["GITHUB_SHA"] or vcs.get("dirty", False):
                      raise RuntimeError(f"{package}: local archive is not from the clean release commit")
              url = f"https://static.crates.io/crates/{package}/{package}-{version}.crate"
              for attempt in range(attempts):
                  try:
                      actual = contents(download(url))
                  except (urllib.error.URLError, TimeoutError):
                      if attempt + 1 == attempts:
                          raise
                      time.sleep(10)
                      continue
                  if actual != expected:
                      raise RuntimeError(f"{package} {version} already exists with different contents; refusing release")
                  print(f"Verified {package} {version}")
                  return


          def plan(version):
              pending = []
              for package in PACKAGES:
                  try:
                      download(f"https://crates.io/api/v1/crates/{package}/{version}")
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      pending.append(package)
                  else:
                      verify_package(package, version, attempts=12)
              print("Pending uploads:", ", ".join(pending) or "none")
              return pending



          def main():
              version = os.environ["VERSION"]
              pending = plan(version)
              if pending:
                  if not os.environ.get("CARGO_REGISTRY_TOKEN"):
                      raise RuntimeError("Set the CARGO_REGISTRY_TOKEN repository secret")
                  for package in pending:
                      print(f"Publishing {package} {version}...")
                      command = [
                          "cargo",
                          "publish",
                          "--locked",
                          "--registry",
                          "crates-io",
                          "--config",
                          'registries.crates-io.credential-provider="cargo:token"',
                          "--package",
                          package,
                      ]
                      subprocess.run(command, check=True)
                      verify_package(package, version, attempts=12)
              for package in PACKAGES:
                  verify_package(package, version, attempts=12)


          if __name__ == "__main__":
              main()
          PY

      - name: Build source archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="gpui-luma-${TAG}/" -o "dist/gpui-luma-${TAG}.tar.gz" "${GITHUB_SHA}"
          shasum -a 256 "dist/gpui-luma-${TAG}.tar.gz" | tee "dist/gpui-luma-${TAG}.tar.gz.sha256"
          cat > dist/manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.workspace_version }}",
            "tag": "${TAG}",
            "commit": "${GITHUB_SHA}",
            "packages": [
              "gpui-luma",
              "gpui-luma-color",
              "gpui-luma-look-radix",
              "gpui-luma-look-shadcn"
            ],
            "distribution": "crates.io"
          }
          EOF
          cat dist/manifest.json

      - name: Create annotated tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.workspace_version }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          ## ${VERSION}

          The four library crates are published on crates.io.

          \`\`\`sh
          cargo add gpui-luma@${VERSION}
          cargo add gpui-luma-look-shadcn@${VERSION}
          # Or: cargo add gpui-luma-look-radix@${VERSION}
          # Optional: cargo add gpui-luma-color@${VERSION}
          cargo add gpui-unofficial --rename gpui
          \`\`\`

          Imports use \`gpui_luma\`, \`gpui_luma_look_shadcn\`,
          \`gpui_luma_look_radix\`, and \`gpui_luma_color\`.

          Source: https://github.com/${{ github.repository }}/tree/${TAG}
          EOF
          flags=()
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" \
              "dist/gpui-luma-${TAG}.tar.gz" \
              "dist/gpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json \
              --clobber
          else
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file dist/release-notes.md \
              --generate-notes ${flags[@]+"${flags[@]}"} \
              "dist/gpui-luma-${TAG}.tar.gz" \
              "dist/gpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json
          fi

      - name: Remove temporary package verification files
        if: always()
        run: rm -rf -- target/package
