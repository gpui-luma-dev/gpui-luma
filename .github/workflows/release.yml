name: Release Library Crates to crates.io

# Normal path: merge the release-plz PR, pass CI, then publish and tag automatically.
# Manual dispatch is available for retrying a failed release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Verify and release SDK libraries
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      CARGO_TERM_COLOR: always
      LIB_PACKAGES: >-
        gpui-luma
        gpui-luma-color
        gpui-luma-look-radix
        gpui-luma-look-shadcn

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          # workflow_run's github.sha is NOT necessarily the commit that passed CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy library crates
        run: |
          cargo clippy --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-targets --all-features

      - name: Test library crates and doctests
        run: |
          cargo test --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-features
          cargo test --locked \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --doc --all-features

      - name: Publish libraries and create tags and releases
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.170
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
