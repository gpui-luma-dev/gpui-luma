name: Build Luma Studio Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: luma-studio-macos-arm64
          # Windows x64 (MSVC Win32)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: luma-studio-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build luma-studio
        run: cargo build --release --package luma-studio --target ${{ matrix.target }}

      - name: Prepare macOS executable archive
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/luma-studio dist/
          cd dist && zip -r ../${{ matrix.artifact_name }}.zip luma-studio

      - name: Prepare Windows executable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item "target/${{ matrix.target }}/release/luma-studio.exe" -Destination "dist/"
          Compress-Archive -Path "dist/luma-studio.exe" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 7
