name: Publish Dev Crates

# Cuts a beta GitHub prerelease for the library crates.
# Consume via git tag (not crates.io).

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LIB_PACKAGES: >-
    gpui-luma-core
    gpui-luma-color
    gpui-luma-look-core
    gpui-luma-look-radix
    gpui-luma-look-shadcn
    gpui-luma-look-shadcn-inspect
    gpui-luma

jobs:
  publish:
    name: Verify, tag, and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          echo "workspace_version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${version}"
          echo "Tag: ${tag}"

      - name: Reject tag if it already exists on another commit
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already points at ${existing}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy library crates
        run: |
          # shellcheck disable=SC2086
          cargo clippy \
            $(printf -- '--package %s ' ${LIB_PACKAGES}) \
            --all-targets

      - name: Check library crates
        run: |
          # shellcheck disable=SC2086
          cargo check \
            $(printf -- '--package %s ' ${LIB_PACKAGES})

      - name: Build source archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="gpui-luma-${TAG}/" -o "dist/gpui-luma-${TAG}.tar.gz" "${GITHUB_SHA}"
          shasum -a 256 "dist/gpui-luma-${TAG}.tar.gz" | tee "dist/gpui-luma-${TAG}.tar.gz.sha256"
          cat > dist/manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.workspace_version }}",
            "tag": "${TAG}",
            "commit": "${GITHUB_SHA}",
            "packages": [
              "gpui-luma",
              "gpui-luma-core",
              "gpui-luma-color",
              "gpui-luma-look-core",
              "gpui-luma-look-radix",
              "gpui-luma-look-shadcn"
            ],
            "distribution": "git-tag"
          }
          EOF
          # Strip leading indentation from the heredoc
          sed -i 's/^          //' dist/manifest.json
          cat dist/manifest.json

      - name: Create annotated tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.workspace_version }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## \`${VERSION}\`

          Beta cut. Prefer **git tag** dependencies (crates.io later).

          ### Typical app

          Depend on the \`gpui-luma\` facade (SDK + look-core), then **one** look:

          \`\`\`toml
          [dependencies]
          luma = { package = "gpui-luma", git = "https://github.com/${{ github.repository }}", tag = "${TAG}" }
          luma-look-shadcn = { package = "gpui-luma-look-shadcn", git = "https://github.com/${{ github.repository }}", tag = "${TAG}" }
          # or: luma-look-radix = { package = "gpui-luma-look-radix", git = "https://github.com/${{ github.repository }}", tag = "${TAG}" }
          # optional: luma-color = { package = "gpui-luma-color", git = "https://github.com/${{ github.repository }}", tag = "${TAG}" }
          \`\`\`

          Imports remain \`use luma::…\`.

          Also in this tag: \`gpui-luma-core\`, \`gpui-luma-look-core\`, \`gpui-luma-color\`, \`gpui-luma-look-shadcn\`, \`gpui-luma-look-radix\`.
          EOF
          )"
          body="$(printf '%s\n' "${body}" | sed 's/^          //')"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" \
              "dist/gpui-luma-${TAG}.tar.gz" \
              "dist/gpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes "${body}" \
              --prerelease \
              "dist/gpui-luma-${TAG}.tar.gz" \
              "dist/gpui-luma-${TAG}.tar.gz.sha256" \
              dist/manifest.json
          fi
