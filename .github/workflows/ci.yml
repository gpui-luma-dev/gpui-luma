name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  # Disables LLVM optimization passes during CI tests to dramatically speed up compilation
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_PACKAGE_GPUI_LUMA_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_PACKAGE_GPUI_UNOFFICIAL_OPT_LEVEL: "0"

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

  test:
    name: Test & Doc-tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Exercise library behavior without linking every demo and shell test binary.
      # Workspace Clippy above still checks every app target and feature.
      # Excludes benchmarks from test builds (--lib --bins --tests).
      - name: Test library crates
        run: >-
          cargo test --locked --lib --bins --tests --all-features
          --package gpui-luma
          --package gpui-luma-color
          --package gpui-luma-look-radix
          --package gpui-luma-look-shadcn

      # Only run doc-tests on library packages that actually contain documentation
      - name: Documentation tests
        run: >-
          cargo test --locked --doc --all-features
          --package gpui-luma
          --package gpui-luma-look-radix
          --package gpui-luma-look-shadcn
