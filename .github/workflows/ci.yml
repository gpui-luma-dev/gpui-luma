name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  # Disables LLVM optimization passes during CI tests to dramatically speed up compilation
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_PACKAGE_GPUI_LUMA_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_PACKAGE_GPUI_UNOFFICIAL_OPT_LEVEL: "0"

jobs:
  scope:
    name: Classify changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Fetch comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CI_BASE_SHA" ] && [ "$CI_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" || echo "Base unavailable; running full CI"
            fi
          fi
      - name: Select native checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/ci_scope.py

  fmt:
    name: Format check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Test CI and release helpers
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native == 'true') }}
    name: Clippy
    timeout-minutes: 30
    # Use the explicit macOS 15 pool rather than the moving latest image.
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

  test:
    needs: scope
    if: ${{ !cancelled() }}
    name: Test & Doc-tests
    timeout-minutes: 40
    # Use the explicit macOS 15 pool rather than the moving latest image.
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Exercise library behavior without linking every demo and shell test binary.
      # Workspace Clippy above still checks every app target and feature.
      # Excludes benchmarks from test builds (--lib --bins --tests).
      # Keep this check name stable: docs-only runs compile snippets here while
      # skipping native test suites, preserving existing required-check coverage.
      - name: Test library crates
        timeout-minutes: 25
        if: needs.scope.result != 'success' || needs.scope.outputs.native == 'true'
        run: >-
          cargo test --locked --lib --bins --tests --all-features
          --package gpui-luma
          --package gpui-luma-color
          --package gpui-luma-plot
          --package gpui-luma-look-radix
          --package gpui-luma-look-shadcn
          --package luma-app-common

      # Only run doc-tests on library packages that actually contain documentation
      - name: Documentation tests
        timeout-minutes: 10
        if: needs.scope.result != 'success' || needs.scope.outputs.native == 'true'
        run: >-
          cargo test --locked --doc --all-features
          --package gpui-luma
          --package gpui-luma-look-radix
          --package gpui-luma-look-shadcn
          --package gpui-luma-plot

      - name: Compile control documentation examples
        timeout-minutes: 10
        run: python3 scripts/check_control_docs.py

  test_queue:
    name: Test queue guard
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      actions: write
    steps:
      # Execution timeouts do not bound waiting for a macOS runner. This uses
      # a separate Linux runner and never checks out or executes PR source.
      - name: Bound test runner wait to 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request

          base = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json"}

          def request(path, method="GET"):
              with urllib.request.urlopen(
                  urllib.request.Request(base + path, headers=headers, method=method), timeout=30
              ) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          deadline = time.monotonic() + 15 * 60
          while True:
              jobs = request(f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")["jobs"]
              test = next((job for job in jobs if job["name"] == "Test & Doc-tests"), None)
              if test and test["status"] in ("in_progress", "completed"):
                  print(f"Test job is {test['status']}; execution timeout now applies.", flush=True)
                  break
              if time.monotonic() >= deadline:
                  print("::error::Test job did not start within 15 minutes. Cancelling CI; retry when runners are available.", flush=True)
                  request(f"/actions/runs/{run_id}/cancel", method="POST")
                  raise SystemExit(1)
              print("Waiting for the macOS test runner...", flush=True)
              time.sleep(30)
