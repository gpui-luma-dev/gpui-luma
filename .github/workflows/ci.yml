name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      # PRs exercise library behavior without linking every demo and shell test binary.
      # Workspace Clippy above still checks every app target and feature.
      - name: Test library crates
        if: github.event_name == 'pull_request'
        run: >-
          cargo test --locked --all-targets --all-features
          --package gpui-luma
          --package gpui-luma-color
          --package gpui-luma-look-radix
          --package gpui-luma-look-shadcn

      - name: Test full workspace
        if: github.event_name != 'pull_request'
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features
