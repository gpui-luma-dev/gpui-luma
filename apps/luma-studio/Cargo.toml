[package]
name = "luma-studio"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Headless builder dispatch tests; does not launch Studio.
test-support = ["gpui-luma/test-support"]

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
gpui-luma.workspace = true
gpui-luma-color.workspace = true
luma-app-common.workspace = true
gpui-luma-look-shadcn = { workspace = true, features = ["inspect"] }
lucide-svg-static.workspace = true
gpui_platform = { workspace = true }
font-kit.workspace = true
thiserror.workspace = true
palette = { workspace = true }
serde = { workspace = true }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
