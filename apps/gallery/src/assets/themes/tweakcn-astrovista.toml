# Astrovista — manual import from tweakcn-astrovista.css (Phase 1)
#
# Source: crates/sdk/src/theme/tweakcn-astrovista.css (CSS stays in SDK for reference)
# Gallery: apps/gallery/src/assets/themes/tweakcn-astrovista.toml
# Mapping: docs/ai/next-step-theme-import.md
#
# Action mapping (Luma slot names match visual weight, not shadcn recipe names):
#   prominent → --primary (coral CTA)
#   standard  → --secondary (filled navy; shadcn "secondary")
#   subtle    → outline recipe: --card + --border (shadcn "outline"; visually quiet)
#   ghost     → transparent + --accent hover
#
# Derivation when CSS has no hover/pressed: prominent/standard +5% L hover, -8% L pressed;
# subtle outline: hover --accent, pressed accent -4% L.

