<svg xmlns="http://www.w3.org/2000/svg" width="24" height="120" viewBox="0 0 24 120" fill="none">
  <!-- Keep rotated labels centered by anchoring text at (12,60) and rotating around (12,60). -->
  <text
    x="12"
    y="60"
    font-family="sans-serif"
    font-size="12"
    font-weight="500"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="currentColor"
    transform="rotate(-90 12 60)"
  >Pressed</text>
</svg>
