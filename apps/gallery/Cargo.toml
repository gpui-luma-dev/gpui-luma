[package]
name = "gpui-luma-gallery"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
gpui-luma = { path = "../../crates/sdk" }
gpui_platform = { workspace = true }
lucide-icons = { workspace = true }
gpui-luma-theme-radix = { path = "../../crates/theme-radix" }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[dev-dependencies]
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit" }
