[package]
name = "luma-docs-embed"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui.workspace = true
gpui-luma.workspace = true
gpui-luma-look-radix.workspace = true
gpui-luma-look-shadcn.workspace = true
luma-app-common.workspace = true
gpui-luma-color.workspace = true
gpui-luma-plot.workspace = true
anyhow.workspace = true
lucide-svg-static.workspace = true
gpui_web = { package = "xgpui-web", version = "=1.0.2", default-features = false }
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3", features = ["console", "Window", "Event", "EventTarget"] }

[lints]
workspace = true
