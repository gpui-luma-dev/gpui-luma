[package]
name = "luma-color-viz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Headless exposition and event-log tests; does not launch Color Viz.
test-support = ["gpui-luma/test-support"]

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
gpui-luma.workspace = true
gpui-luma-color.workspace = true
luma-app-common.workspace = true
gpui_platform = { workspace = true }
image = { workspace = true }
gpui-luma-look-shadcn.workspace = true
lucide-svg-static.workspace = true
palette = { workspace = true }
smallvec = { workspace = true }
tiny-skia = { workspace = true }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
