[package]
name = "gpui-luma-graph-viz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
gpui-luma = { path = "../../crates/sdk" }
gpui-luma-fonts = { path = "../../crates/font-assets" }
gpui_platform = { workspace = true }
gpui-luma-look-shadcn = { path = "../../crates/look-shadcn" }
lucide-svg-static.workspace = true
tracing = "0.1"
fitparser = "0.7"
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
