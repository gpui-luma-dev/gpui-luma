# Inherits the vanilla motion baseline from gpui-luma/assets/style.toml.
# This file supplies look-specific overrides.

# Radix body motion, previously supplied by Radix Studio.
[common.motion.tabs.content]
kind = "timed"
duration_ms = 300
easing = "out_cubic"

