[package]
name = "gpui-luma-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
font-download = ["dep:google-fonts"]

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
google-fonts = { version = "0.1.5", default-features = false, features = ["full"], optional = true }
tracing = "0.1"

[[bin]]
name = "download-google-fonts"
path = "src/bin/download-google-fonts.rs"
required-features = ["font-download"]
