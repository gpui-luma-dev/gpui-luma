[package]
name = "gpui-luma"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = ["crates-io"]
description = "GPUI-Luma foundation: controls, layouts, themes, and shared look contracts"
repository.workspace = true
homepage.workspace = true
keywords = ["gpui", "gui", "ui", "widgets", "desktop"]
categories = ["gui"]

[features]
# Headless GPUI event-dispatch regression tests; does not launch Studio.
test-support = ["gpui/test-support"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
lucide-svg-static.workspace = true
serde = { workspace = true, features = ["derive"] }
ttf-parser = "0.25"
palette.workspace = true
smallvec.workspace = true
toml.workspace = true

[[bench]]
name = "render_hot_paths"
harness = false
