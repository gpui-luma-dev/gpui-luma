# -----------------------------------------------------------------------------
# Known conflicts — tune [palette] or per-theme catalog overrides after gallery review
# -----------------------------------------------------------------------------

[[conflicts]]
id = "brand-vs-selected-vs-nav"
description = "primary / sidebar-primary compete for prominent, selected, and navigation.selected."
paths = [
  "palette.action.prominent.background",
  "palette.state.selected.background",
  "palette.navigation.selected_background",
]
resolution = "Adjust palette.nav_selected vs palette.brand per theme catalog; Astrovista dark may prefer sidebar-accent for hover."

[[conflicts]]
id = "secondary-vs-subtle"
description = "shadcn secondary is a filled tone (Standard), not outline (Subtle)."
paths = ["palette.action.standard.background", "palette.action.subtle.background"]
resolution = "Never map --secondary to action.subtle; use fill_secondary vs outline_surface palette aliases."

[[conflicts]]
id = "font-family-name-table"
description = "TOML font-sans may not match embedded TTF name table (e.g. Rajdhani Variable)."
paths = ["typography.font.sans.family"]
resolution = "Post-process first_font or per-theme font manifest; see gallery fonts.rs."

[[conflicts]]
id = "typography-scale"
description = "text.* sizes inherit base Luma scale; tweakcn rem scale not imported yet."
paths = ["typography.text.body.size", "typography.text.label.size"]
resolution = "Future: map text-sm/text-base from catalog or theme-specific overrides."

[[conflicts]]
id = "white-orange-secondary"
description = "white-orange theme may map --secondary to Subtle not Standard."
paths = ["palette.action.standard.background", "palette.action.subtle.background"]
resolution = "Per-catalog palette override when adding tweakcn-white-orange."
