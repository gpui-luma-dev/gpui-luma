# Jarvis — manual import from tweakcn-jarvis.css (Phase 1)
#
# Source: crates/sdk/src/theme/tweakcn-jarvis.css
# Mapping: docs/ai/next-step-theme-import.md (Subtle = outline, Standard = --secondary fill)
#
# Notable CSS vs native Luma (may need SDK/gallery follow-up):
#   --radius: 0.25rem light (4px), 0.125rem dark (2px) — per-mode metrics below
#   --font-sans: Rajdhani; --font-mono: JetBrains Mono; --tracking-normal: 0.02em (no TOML slot yet)
#   Dark shadows use cyan glow (rgb 34,211,238) — approximated in elevation layers
#
# Derivation: prominent/standard +5% L hover, -8% L pressed; subtle outline hover --accent.

