# Table surface padding scales with shared control metrics; row hover is accent alpha.
[common.table.geometry]
# Compact drag preview dimensions, padding and pointer offset in pixels.
drag_offset = 12.0
drag_width = 220.0
drag_padding_x = 12.0
drag_padding_y = 8.0
drag_border_width = 1.0
# Insertion feedback stroke thickness in pixels.
drag_marker_width = 2.0
# Frame and header separator thickness in pixels; zero hides the stroke.
border_width = 1.0
header_divider_width = 1.0
# Header bottom padding as a fraction of the resolved vertical padding.
header_padding_bottom_scale = "math(3 / 4)"
padding_x = 0.0
padding_y_scale = "math(1 / 2)"
row_radius = 0.0
row_hover_opacity = 0.4
# Whole-row opacity when the row is disabled (0 transparent, 1 opaque).
row_disabled_opacity = 0.56

# Popup separation scales with the trigger's gap unless menu_offset_y is explicit.
[common.selector.geometry]
menu_offset_scale = "math(1 / 2)"

# Pager recipes are relative to small-control metrics; explicit geometry wins.
[common.pager.geometry]
padding_x_inset_scale = "math(1 / 2)"
padding_y_gap_scale = "math(1 / 2)"
button_extra_width_scale = 1.0
disabled_opacity = 0.56

[common.pager.sizes.minimal]
button_extra_width_scale = 0.0

[common.popup_menu.geometry]
menu_offset_scale = "math(1 / 2)"

# Placement defaults are captured by builders; explicit offsets/margins win.
[common.popover.geometry]
window_margin = 8.0

[common.popover.sizes.button]
offset_y = 0.0

[common.popover.sizes.panel]
offset_y = 4.0

[common.slide_panel.geometry]
side_width = 360.0
edge_height = 420.0
edge_max_viewport_ratio = 0.72


[common.resizable_panels.sizes.sm]
lane_width = 8.0
hit_target = 12.0
grip_cross_axis = 4.0
grip_main_axis = 36.0

[common.resizable_panels.sizes.md]
lane_width = 12.0
hit_target = 14.0
grip_cross_axis = 6.0
grip_main_axis = 40.0

[common.resizable_panels.sizes.lg]
lane_width = 18.0
hit_target = 20.0
grip_cross_axis = 8.0
grip_main_axis = 44.0

[common.radio_group.geometry]
item_gap = 8.0
disabled_opacity = 0.56

[common.radio_group.sizes.vertical]
gap = 8.0

[common.radio_group.sizes.horizontal]
gap = 12.0

# Composite input affordances; dimensions are logical pixels.
[common.autocomplete.geometry]
gap = 10.0
status_gap = 10.0
clear_inset = 10.0
clear_width = 18.0
clear_icon_size = 12.0
trigger_width = 240.0
popup_extra_width = 24.0

[common.combobox.geometry]
affordance_inset = 10.0
affordance_width = 18.0
affordance_icon_size = 12.0
affordance_gap = 2.0
trigger_extra_gap = 8.0

[common.search_selector.geometry]
search_icon_width = 18.0
search_icon_size = 12.0
trigger_icon_extra_width = 10.0
trigger_extra_gap = 8.0
search_padding = 8.0
search_separator_height = 1.0
search_padding_reduction = 3.0
search_input_height_floor = 18.0
# Estimated search field/chrome reservation when filling the viewport.
search_chrome_height = 57.0
trailing_icon_size = 14.0
