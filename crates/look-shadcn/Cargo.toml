[package]
name = "gpui-luma-look-shadcn"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = ["crates-io"]
description = "Shadcn themes, CSS tokens, and styled controls for GPUI-Luma"
repository.workspace = true
homepage.workspace = true
keywords = ["gpui", "gui", "shadcn", "themes", "widgets"]
categories = ["gui"]

[features]
# Optional inspection data and formatting for developer tools.
inspect = []
# Headless ListBox composition and DnD dispatch tests.
test-support = ["gpui-luma/test-support"]

[dependencies]
gpui.workspace = true
gpui-luma.workspace = true
gpui-luma-color.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
lucide-svg-static.workspace = true

[lints]
workspace = true
