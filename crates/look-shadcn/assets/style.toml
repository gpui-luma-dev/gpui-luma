# =====================================================================
# 2. CHECKBOX
# =====================================================================
# shadcn/ui uses shadow-xs on indicators.
[[checkbox.elevation_rules]]
shadow = "shadow-xs"

[[checkbox.elevation_rules]]
layer = "disabled"
shadow = "none"

[[checkbox.color_rules]]
layer = "disabled"
indicator_background = "muted"
checkmark_color = "muted-foreground"
label_color = "muted-foreground"

[[checkbox.color_rules]]
checked = false
indicator_background = "@outline_layer"
checkmark_color = "foreground"
label_color = "foreground"

[[checkbox.color_rules]]
checked = true
indicator_background = "@action_layer"
checkmark_color = "@action_foreground"
label_color = "foreground"


# =====================================================================
# 3. RADIO
# =====================================================================
[radio.indicator_defaults]
primary = "filled"
secondary = "ring"
outline = "ring"
ghost = "ring"

# shadcn/ui uses shadow-xs on indicators.
[[radio.elevation_rules]]
shadow = "shadow-xs"

[[radio.elevation_rules]]
layer = "disabled"
shadow = "none"

[[radio.color_rules]]
layer = "disabled"
indicator_background = "muted"
selection_ring = "muted-foreground"
dot_color = "muted-foreground"
label_color = "muted-foreground"

[[radio.color_rules]]
selected = false
indicator_background = "@outline_layer"
selection_ring = "border"
dot_color = "foreground"
label_color = "foreground"

[[radio.color_rules]]
selected = true
indicator = "filled"
indicator_background = "@action_layer"
selection_ring = "@action_layer"
dot_color = "@action_foreground"
label_color = "foreground"

[[radio.color_rules]]
selected = true
indicator = "ring"
indicator_background = "@outline_layer"
selection_ring = "@action_layer"
dot_color = "@action_foreground"
label_color = "foreground"

[[radio.color_rules]]
selected = true
indicator = "dot"
indicator_background = "@outline_layer"
selection_ring = "border"
dot_color = "@action_layer"
label_color = "foreground"


# =====================================================================
# 4. SWITCH
# =====================================================================
# shadcn/ui uses shadow-xs on the track; shadow-sm reads better at GPUI scale.
[[switch.elevation_rules]]
shadow = "shadow-sm"

[[switch.elevation_rules]]
layer = "disabled"
shadow = "none"

# Switch geometry: track thickness aligns with checkbox/radio indicator sizes.
[switch.metrics.sm]
width = 32.0
height = 13.0
thumb_size = 9.0

[switch.metrics.md]
width = 40.0
height = 18.0
thumb_size = 14.0

[switch.metrics.lg]
width = 48.0
height = 24.0
thumb_size = 20.0

[[switch.color_rules]]
disabled = true
track_background = "muted"
thumb_background = "muted-foreground"
thumb_border = "muted"
label_color = "muted-foreground"

[[switch.color_rules]]
on = true
disabled = false
track_background = "@action_default"
thumb_background = "@action_foreground"
thumb_border = "@action_foreground"
label_color = "foreground"

[[switch.color_rules]]
on = false
disabled = false
track_background = "input"
thumb_background = "background"
thumb_border = "border"
label_color = "foreground"


