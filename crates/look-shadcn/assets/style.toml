# style.toml - Unified Stylesheet Mapping Configuration
# Schema reference: docs/ai/style.schema.json

# =====================================================================
# 0. TYPOGRAPHY
# =====================================================================
[typography.semantic.h1]
size = 32.0
line_height = 40.0
weight = 700.0

[typography.semantic.h2]
size = 24.0
line_height = 32.0
weight = 600.0

[typography.semantic.h3]
size = 18.0
line_height = 26.0
weight = 600.0

[typography.semantic.h4]
size = 16.0
line_height = 24.0
weight = 600.0

[typography.semantic.p]
size = 14.0
line_height = 20.0
weight = 400.0

[typography.scale.xs]
size = 12.0
line_height = 16.0
weight = 500.0

[typography.scale.sm]
size = 13.0
line_height = 18.0
weight = 400.0

[typography.scale.base]
size = 14.0
line_height = 20.0
weight = 400.0

[typography.scale.lg]
size = 16.0
line_height = 24.0
weight = 500.0

[typography.scale.xl]
size = 18.0
line_height = 26.0
weight = 600.0

[typography.scale."2xl"]
size = 20.0
line_height = 28.0
weight = 600.0

# =====================================================================
# 0.5 PAGER
# =====================================================================
[pager.metrics]
button_size = 28.0
button_min_width = 32.0
control_height = "metrics.control.sm"
radius = "radius"
padding_x = 8.0
padding_y = 8.0
gap = 4.0
group_gap = 16.0

# =====================================================================
# 1. BUTTON
# =====================================================================
[button.metrics.sm]
height = "metrics.control.sm"
padding_horizontal = 12.0
font_size = 12.0
icon_size = 14.0
corner_radius = "radius"
shadow = "shadow-xs"

[button.metrics.md]
height = "metrics.control.md"
padding_horizontal = 16.0
font_size = 14.0
icon_size = 16.0
corner_radius = "radius"
shadow = "shadow-sm"

[button.metrics.lg]
height = "metrics.control.lg"
padding_horizontal = 20.0
font_size = 16.0
icon_size = 18.0
corner_radius = "radius"
shadow = "shadow-md"

