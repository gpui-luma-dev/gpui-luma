[workspace]
resolver = "2"
members = [
  "crates/sdk",
  "crates/luma-color",
  "crates/look-core",
  "crates/look-shadcn",
  "crates/look-shadcn-inspect",
  "crates/look-radix",
  "apps/common",
  "apps/luma-studio",
  "apps/radix-studio",
  "apps/neumorphic-demo",
  "apps/color-viz",
  "apps/shells/common",
  "apps/shells/unified",
  "apps/shells/inset",
  "apps/shells/icon-rail",
  "apps/shells/detached",
  "apps/shells/split-titlebar",
  "apps/shells/vscode",
]
default-members = ["crates/sdk", "apps/luma-studio", "apps/neumorphic-demo", "apps/color-viz"]

[workspace.package]
version = "0.9.0-beta.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
luma = { package = "gpui-luma-core", path = "crates/sdk" }
luma-color = { package = "gpui-luma-color", path = "crates/luma-color" }
luma-look-core = { package = "gpui-luma-look-core", path = "crates/look-core" }
luma-look-shadcn = { package = "gpui-luma-look-shadcn", path = "crates/look-shadcn" }
luma-look-shadcn-inspect = { package = "gpui-luma-look-shadcn-inspect", path = "crates/look-shadcn-inspect" }
luma-look-radix = { package = "gpui-luma-look-radix", path = "crates/look-radix" }
luma-app-common = { path = "apps/common" }
gpui = { package = "gpui-unofficial", version = "1.13.1" }
lucide-svg-static = { package = "lucide-static-svg", version = "1.45.0" }
gpui_platform = {
  package = "gpui-platform-gpui-unofficial",
  version = "1.13.1",
  features = ["font-kit"],
}
image = "0.25"
serde = "1"
smallvec = "1"
tiny-skia = "0.11"
toml = "0.8"
palette = "0.7.6"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit" }
thiserror = "2"

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui-luma-core]
opt-level = 2

[profile.dev.package.luma-studio]
opt-level = 1

[profile.dev.package.luma-neumorphic-demo]
opt-level = 1

[profile.dev.package.luma-color-viz]
opt-level = 1

[profile.dev.package.luma-radix-studio]
opt-level = 1

[profile.dev.package.luma-shell-unified]
opt-level = 1

[profile.dev.package.luma-shell-inset]
opt-level = 1

[profile.dev.package.luma-shell-icon-rail]
opt-level = 1

[profile.dev.package.luma-shell-detached]
opt-level = 1

[profile.dev.package.luma-shell-split-titlebar]
opt-level = 1

[profile.dev.package.luma-shell-vscode]
opt-level = 1

[profile.dev.package.gpui-unofficial]
opt-level = 3

[profile.dev.package.gpui-platform-gpui-unofficial]
opt-level = 3

[profile.dev.package.smol]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
